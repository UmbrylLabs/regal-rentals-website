<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Initialize Regal Rentals Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <main class="admin-shell">
    <section class="login-card">
      <img src="/assets/regal-shield.png" alt="" />
      <p class="eyebrow">One-time setup</p>
      <h1>Create Owner Account</h1>
      <p>This page works only before the first owner account exists.</p>
      <form id="setup-form">
        <label>Owner name<input id="setup-name" autocomplete="name" required /></label>
        <label>Owner email<input id="setup-email" type="email" autocomplete="email" required /></label>
        <label>Password<input id="setup-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /></label>
        <label>Cloudflare bootstrap token<input id="setup-token" type="password" autocomplete="off" required /></label>
        <button type="submit">Create Owner Account</button>
        <p class="message" id="setup-message" aria-live="polite"></p>
      </form>
      <p><a href="/admin/">Return to admin login</a></p>
    </section>
  </main>
  <script src="/admin/setup.js" defer></script>
</body>
</html>
