name: Booking backend safety tests

on:
  pull_request:
    paths:
      - "functions/**"
      - "migrations/**"
      - "tests/**"
      - "admin/**"
      - "docs/**"
      - "rentals.js"
      - "event-time.js"
      - "rentals.html"
      - "rentals.css"
      - "rentals-enhancements.css"
      - "catalog-dynamic.css"
      - "sign.js"
      - "sign.html"
      - "sign.css"
      - "sign-security.css"
      - "sign-review.css"
      - "sign-review.js"
      - "pay.html"
      - "pay.css"
      - "pay.js"
      - "_headers"
      - "package.json"
      - ".github/workflows/booking-backend-tests.yml"
  push:
    branches:
      - feature/booking-backend
    paths:
      - "functions/**"
      - "migrations/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test database inventory guards
        run: python3 -m unittest -v tests/test_inventory_guards.py
      - name: Test shared inventory policy
        run: node tests/test_inventory_policy.mjs
      - name: Test Pacific event-time conversion
        run: node tests/test_event_time.mjs
      - name: Test rentals UI readiness
        run: node tests/test_rentals_ui.mjs
      - name: Test public signing link origin
        run: node tests/test_signing_origin.mjs
      - name: Test modular agreement generation
        run: node tests/test_modular_agreement.mjs
      - name: Test customer payment-security choice
        run: node tests/test_customer_security_choice.mjs
      - name: Test payment-method signing UI contract
        run: node tests/test_payment_method_ui_contract.mjs
      - name: Test signing review layout
        run: node tests/test_sign_review_ui.mjs
      - name: Test booking document safety rules
        run: node tests/test_booking_files.mjs
      - name: Test Square payment policy
        run: node tests/test_square_payment_policy.mjs
      - name: Test Square payment interfaces
        run: node tests/test_square_payment_ui.mjs
      - name: Check JavaScript syntax
        run: |
          find functions admin -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check event-time.js
          node --check rentals.js
          node --check sign.js
          node --check sign-review.js
          node --check pay.js
